plugins {
    id 'com.android.application'
}

// Personal settings come from the environment (.env, see .env.example), never from the repo
def env = { String name -> System.getenv(name) ?: '' }
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def array = { List<String> values -> 'new String[]{' + values.collect { quoted(it) }.join(', ') + '}' }

// Profiles: PROFILE_1_EMAIL, PROFILE_2_EMAIL, … read in order until the first missing email
def profiles = []
for (int i = 1; env("PROFILE_${i}_EMAIL".toString()); i++) {
    def key = { String name -> env("PROFILE_${i}_${name}".toString()) }
    profiles << [email: key('EMAIL'), footballTeams: key('FOOTBALL_TEAM_IDS')]
}
if (profiles.isEmpty()) {
    throw new GradleException('No profiles: set at least PROFILE_1_EMAIL in .env (see .env.example)')
}

android {
    namespace 'me.earthpyy.googletvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'me.earthpyy.googletvlauncher'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String[]', 'PROFILE_EMAILS', array(profiles*.email)
        buildConfigField 'String[]', 'PROFILE_FOOTBALL_TEAM_IDS', array(profiles*.footballTeams)
        buildConfigField 'String', 'FOOTBALL_DATA_TOKEN', quoted(env('FOOTBALL_DATA_TOKEN'))
        buildConfigField 'String', 'HASS_URL', quoted(env('HASS_URL'))
        buildConfigField 'String', 'HASS_TOKEN', quoted(env('HASS_TOKEN'))
        buildConfigField 'String', 'HASS_WEATHER', quoted(env('HASS_WEATHER'))
        buildConfigField 'String', 'HASS_AQI', quoted(env('HASS_AQI'))
        buildConfigField 'String', 'HASS_INSIDE_TEMPERATURE', quoted(env('HASS_INSIDE_TEMPERATURE'))
        buildConfigField 'String', 'HASS_INSIDE_HUMIDITY', quoted(env('HASS_INSIDE_HUMIDITY'))
        buildConfigField 'String', 'HASS_LIGHT', quoted(env('HASS_LIGHT'))
        buildConfigField 'String', 'HASS_CLIMATE', quoted(env('HASS_CLIMATE'))
        buildConfigField 'String', 'HASS_CLIMATE_FAN_MODES', quoted(env('HASS_CLIMATE_FAN_MODES'))
        buildConfigField 'int', 'HASS_CLIMATE_MIN_TEMP', env('HASS_CLIMATE_MIN_TEMP') ?: '23'
        buildConfigField 'int', 'HASS_CLIMATE_MAX_TEMP', env('HASS_CLIMATE_MAX_TEMP') ?: '26'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Read from the environment (.env), never from the repo
            def keystore = System.getenv('KEYSTORE_FILE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
}
